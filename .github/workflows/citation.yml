name: citation

on:
  push:
    branches: [main, master]
    paths: ["CITATION.cff", ".zenodo.json", "codemeta.json", "LICENSE", "tools/check_citation.py", ".github/workflows/citation.yml"]
  pull_request:
    paths: ["CITATION.cff", ".zenodo.json", "codemeta.json", "LICENSE", "tools/check_citation.py", ".github/workflows/citation.yml"]

permissions:
  contents: read

jobs:
  citation-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check CITATION.cff, .zenodo.json and codemeta.json
        run: python tools/check_citation.py
